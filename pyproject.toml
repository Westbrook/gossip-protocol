cache_dir = ".cache/mypy"
incremental = true
check_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
pretty = false
# Check all development tools, v2 study paths, two clean legacy leaves, and their imports.
# Exact pre-existing diagnostics in unchanged scientific files are recorded
# with SHA256 in devtools/type-baseline.json. New or changed diagnostics fail;
# changed baseline sources require deliberate remediation and review. No
# devtools or new verification_* study diagnostic may enter that baseline.

[[tool.mypy.overrides]]
module = "devtools.static_checks"
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
