[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gossip-protocol-lab"
version = "0.1.0"
description = "A local correctness lab for distributed Git integration and agent evidence exchange"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gossip-lab = "gossip_harness.__main__:main"

[tool.setuptools]
py-modules = ["retain_experiments", "retain_swarm"]

[tool.setuptools.packages.find]
include = ["gossip_harness*", "devtools*"]
exclude = ["devtools.browser.node_modules*"]

[dependency-groups]
# Install the hashed transitive lock with scripts/bootstrap-dev; do not resolve
# or recreate the environment on every verification invocation.
dev = ["ruff==0.15.12", "mypy==1.20.2"]

[tool.devtools.static]
# Authored inputs only: never recursively search generated runs/results or venvs.
roots = ["gossip_harness", "tests", "simulation", "analysis", "devtools", "retain_experiments.py", "retain_swarm.py", "fixtures/library-m4-compatibility-v1/build_snapshots.py"]
timeout_seconds = 120
javascript_syntax = "devtools/browser/check_syntax.cjs"
type_baseline = "devtools/type-baseline.json"

[tool.ruff]
target-version = "py311"
cache-dir = ".cache/ruff"
force-exclude = true
extend-exclude = ["runs", "results", ".venv", ".cache"]

[tool.ruff.lint]
# Correctness-first baseline over every owned Python root. Style and unused
# imports are intentionally outside this first gate; frozen runner bytes matter.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
